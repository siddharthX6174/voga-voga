<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>voga voga</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Chat History</h3>
                <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
            </div>
            <ul id="session-list" class="session-list">
                <!-- Sessions will be injected here via JS -->
            </ul>
        </div>
        
        <!-- Main Chat Area -->
        <div class="chat-container">
            <header>
                <div class="header-content">
                    <h2>voga voga</h2>
                </div>
            </header>
            <div id="chat-box" class="chat-box"></div>
            <div class="input-area">
                <input type="file" id="file-upload" accept=".pdf" style="display: none;" onchange="uploadDocument(this.files[0])">
                <button onclick="document.getElementById('file-upload').click()" title="Upload Document" class="upload-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <input type="text" id="user-input" placeholder="Ask about policies, guidelines, or metrics..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()" title="Send Message">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
    <script src="script.js?v=3"></script>
</body>
</html>
